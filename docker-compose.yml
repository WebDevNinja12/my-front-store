version: '3.8'

services:
  web:
    build: .
    command: gunicorn shop_project.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=prod-secret-key-change-me
      - ALLOWED_HOSTS=*

volumes:
  static_volume:
  media_volume:
